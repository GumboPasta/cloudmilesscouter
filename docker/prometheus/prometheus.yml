# Phase 6 Step 1 — Prometheus scrape config.
#
# The api and worker binaries run on the host (see README "Running the
# binaries"), so Prometheus reaches them through host.docker.internal. The ETL
# is a manually-run batch job: it pushes to the Pushgateway on completion and
# Prometheus scrapes that instead.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:2112"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
