<!--
  Hand-built minimal Alaska "Use points" results grid — real class names,
  data-testid patterns and the [aria-label*="flight path"] hook observed live
  on alaskaair.com/search/results (2026-09), trimmed to what AlaskaExtractJS
  reads. Two cards:

    card 0: nonstop AS 305, Main + First
    card 1: "Multiple flights" via PDX, one stop, next-day arrival, Main only

  TestAlaskaExtractJS asserts the stop count comes from the
  "flight-details-<i>-stops-<n>" data-testid and the via airport from the path
  widget's aria-label element, not from the old .relative utility class.
-->
<h1 class="route-heading">Seattle (SEA) to San Diego (SAN)</h1>

<div class="flight-card-content">
  <div class="flight-header">
    <span class="flight-number">AS 305</span>
    <span class="duration">2h 48m</span>
    <span class="duration-next-day">2h 48m</span>
  </div>
  <div data-testid="flight-details-0-stops-0">
    <div aria-label="Nonstop direct flight path"><span>Nonstop</span></div>
  </div>
  <div class="flight-times-row">
    <span class="departure-time" data-testid="departure-time">6:00 am</span>
    <span class="airport-code">SEA</span>
    <span class="arrival-time" data-testid="arrival-time">8:48 am</span>
    <span class="airport-code">SAN</span>
  </div>
  <div class="flight-card-fares">
    <button data-testid="valuetile-0-0">Main 17.5k points pts + $6 One way</button>
    <button data-testid="valuetile-0-1">First 32.5k points pts + $6 One way Recliner last 5 seats</button>
  </div>
</div>

<div class="flight-card-content">
  <div class="flight-header">
    <span class="flight-number">Multiple flights</span>
    <span class="duration">8h 2m</span>
    <span class="duration-next-day">8h 2m +1 day</span>
  </div>
  <div data-testid="flight-details-1-stops-1">
    <div aria-label="Flight path with 1 stop"><span>PDX 8h 2m</span></div>
  </div>
  <div class="flight-times-row">
    <span class="departure-time" data-testid="departure-time">9:59 pm</span>
    <span class="airport-code">SEA</span>
    <span class="arrival-time" data-testid="arrival-time">3:43 pm</span>
    <span class="airport-code">SAN</span>
  </div>
  <div class="flight-card-fares">
    <button data-testid="valuetile-1-0">Main 32.5k points pts + $12 One way</button>
  </div>
</div>
